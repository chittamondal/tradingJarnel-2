<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Trade Log Table</h2>

    <!-- input form for new trade -->
    <div class="form-container">
      <input type="date" id="date" placeholder="Date">
      <input type="text" id="day" placeholder="Day (e.g. Mon)">
      <input type="time" id="time" placeholder="Time">
      <input type="text" id="entrytime" placeholder="Entry Time">
      <input type="text" id="band" placeholder="Band">
      <input type="text" id="rsi" placeholder="RSI">
      <input type="text" id="sl" placeholder="Stop Loss">
      <input type="text" id="targetUnreached" placeholder="Unreached Target">
      <input type="text" id="target" placeholder="Target">
      
      <button id="btn">Add Trade</button>
    </div>

    <!-- table -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Day</th>
            <th>Time</th>
            <th>Entry Time</th>
            <th>Band</th>
            <th>RSI</th>
            <th>SL</th>
            <th>Target Unreached</th>
            <th>Target</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Rows will be dynamically added here -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
